<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Outer Corkboard Background with Neobrutalist Shadow -->
  <rect x="6" y="6" width="52" height="52" rx="8" fill="#000000" />
  <rect x="4" y="4" width="52" height="52" rx="8" fill="#EAB308" stroke="#000000" stroke-width="3" />

  <!-- Cork Texture Dots -->
  <circle cx="12" cy="12" r="1.5" fill="#CA8A04" />
  <circle cx="48" cy="14" r="1.5" fill="#CA8A04" />
  <circle cx="14" cy="46" r="1.5" fill="#CA8A04" />
  <circle cx="46" cy="48" r="1.5" fill="#CA8A04" />

  <!-- Sticky Note with Shadow -->
  <rect x="18" y="20" width="32" height="32" rx="3" fill="#000000" transform="rotate(-6 34 36)" />
  <rect x="16" y="18" width="32" height="32" rx="3" fill="#FEF08A" stroke="#000000" stroke-width="3" transform="rotate(-6 32 34)" />

  <!-- Note Content Lines -->
  <line x1="22" y1="28" x2="38" y2="26" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  <line x1="22" y1="34" x2="42" y2="32" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  <line x1="22" y1="40" x2="34" y2="38" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />

  <!-- Pushpin / Thumbtack -->
  <!-- Pin Needle Shadow -->
  <line x1="33" y1="12" x2="33" y2="20" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  <!-- Pin Head Body -->
  <path d="M 27 12 L 37 12 L 35 7 L 37 5 L 27 5 L 29 7 Z" fill="#EF4444" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
  <!-- Pin Top Knob -->
  <circle cx="32" cy="5" r="3.5" fill="#EF4444" stroke="#000000" stroke-width="2" />
  <circle cx="30.5" cy="4" r="1" fill="#FFFFFF" />
</svg>
